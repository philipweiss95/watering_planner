# Replace switch.smart_plug_mini and switch.smart_plug_mini_refill in
# configuration.yaml if Home Assistant assigned other entity IDs.
- id: bewaesserung_tagesfenster
  alias: Bewaesserung - Tagesfenster
  description: Prüft regelmäßig, ob der Planner einen Pumpzyklus in einem Tagesfenster freigibt.
  mode: single

  trigger:
    - platform: time_pattern
      minutes: "/15"

  action:
    - action: homeassistant.update_entity
      target:
        entity_id: sensor.bewaesserung_planner

    - delay:
        seconds: 2

    - condition: template
      value_template: >
        {{ states('sensor.bewaesserung_planner') in ['True', 'true', 'on'] }}

    - action: script.bewaesserung_pumpzyklus

# The random webhook ID must match HOME_ASSISTANT_WEBHOOK_URL in
# .env.synology on the NAS. Opening the URL in a browser sends GET and does not
# start the pump.
- id: bewaesserung_manueller_sofortlauf
  alias: Bewaesserung - Manueller Sofortlauf
  description: Startet einen vom Planner angeforderten Pumpzyklus.
  mode: single

  trigger:
    - platform: webhook
      webhook_id: 45dbcc8d4b31475289af2fd6ecb0eaf9
      allowed_methods:
        - POST
      local_only: false

  action:
    - action: script.bewaesserung_pumpzyklus
      data:
        run_id: "{{ trigger.json.run_id }}"

- id: bewaesserung_manuelle_nachfuellung
  alias: Bewaesserung - Manuelle Nachfuellung
  description: Startet einen vom Planner angeforderten Nachfuelllauf.
  mode: single

  trigger:
    - platform: webhook
      webhook_id: 15dbcc8d4b31475289af2fd6ecb0eaf9
      allowed_methods:
        - POST
      local_only: false

  action:
    - action: script.bewaesserung_nachfuellen
      data:
        run_id: "{{ trigger.json.run_id }}"
        run_type: manual

- id: bewaesserung_haupttank_nachfuellen
  alias: Bewaesserung - Haupttank nachfuellen
  description: Prueft alle 15 Minuten den Planner und fuellt bei freigegebenem Nachfuellbedarf aus dem Vorratstank nach.
  mode: single

  trigger:
    - platform: time_pattern
      minutes: "/15"

  action:
    - action: homeassistant.update_entity
      target:
        entity_id: sensor.bewaesserung_planner

    - delay:
        seconds: 2

    - condition: template
      value_template: >
        {% set refill = state_attr('sensor.bewaesserung_planner', 'refill') or {} %}
        {{ refill.get('enabled') and refill.get('run_now') and refill.get('duration_seconds', 0) | int(0) > 0 }}

    - action: script.bewaesserung_nachfuellen
      data:
        run_type: automatic

- id: bewaesserung_nachfuellpumpe_neustart_sicherung
  alias: Bewaesserung - Nachfuellpumpe nach Neustart sichern
  description: Schaltet die Nachfuellpumpe bei Home-Assistant-Start aus und markiert einen gemerkten Lauf als unklar.
  mode: single

  trigger:
    - platform: homeassistant
      event: start

  action:
    - action: switch.turn_off
      target:
        entity_id: switch.smart_plug_mini_refill
      continue_on_error: true

    - action: timer.cancel
      target:
        entity_id: timer.watering_refill_pump_guard
      continue_on_error: true

    - variables:
        interrupted_run_id: "{{ states('input_text.watering_refill_active_run_id') }}"

    - choose:
        - conditions: >
            {{ interrupted_run_id not in ['', 'unknown', 'unavailable'] }}
          sequence:
            - action: rest_command.bewaesserung_refill_fail
              data:
                run_id: "{{ interrupted_run_id }}"
                error: "Home Assistant wurde waehrend des Nachfuelllaufs neu gestartet."
                may_have_transferred: true
              continue_on_error: true
            - action: input_text.set_value
              target:
                entity_id: input_text.watering_refill_active_run_id
              data:
                value: ""

- id: bewaesserung_nachfuellpumpe_sicherheitsabschaltung
  alias: Bewaesserung - Nachfuellpumpe Sicherheitsabschaltung
  description: Schaltet die Nachfuellpumpe auch dann aus, wenn das laufende Script abgebrochen wurde.
  mode: single

  trigger:
    - platform: event
      event_type: timer.finished
      event_data:
        entity_id: timer.watering_refill_pump_guard

  action:
    - variables:
        interrupted_run_id: "{{ states('input_text.watering_refill_active_run_id') }}"

    - action: switch.turn_off
      target:
        entity_id: switch.smart_plug_mini_refill
      continue_on_error: true

    - choose:
        - conditions: >
            {{ interrupted_run_id not in ['', 'unknown', 'unavailable'] }}
          sequence:
            - action: rest_command.bewaesserung_refill_fail
              data:
                run_id: "{{ interrupted_run_id }}"
                error: "Sicherheitsabschaltung nach ausbleibendem Scriptabschluss."
                may_have_transferred: true
              continue_on_error: true
            - action: input_text.set_value
              target:
                entity_id: input_text.watering_refill_active_run_id
              data:
                value: ""

- id: bewaesserung_tank_warnung
  alias: Bewaesserung - Tankwarnung
  description: Meldet, wenn der Planner den Wassertank als niedrig oder nicht ausreichend einstuft.
  mode: single

  trigger:
    - platform: state
      entity_id: sensor.bewaesserung_planner

  condition:
    - condition: template
      value_template: >
        {% set tank = state_attr('sensor.bewaesserung_planner', 'tank') or {} %}
        {% set refill = state_attr('sensor.bewaesserung_planner', 'refill') or {} %}
        {% set refill_tank = refill.get('refill_tank', {}) %}
        {{ tank.get('low') or tank.get('empty_soon') or refill_tank.get('empty') or refill.get('limited_by_refill_tank') }}

  action:
    - action: persistent_notification.create
      data:
        title: Bewaesserung - Tank pruefen
        message: >
          {% set tank = state_attr('sensor.bewaesserung_planner', 'tank') or {} %}
          {% set refill = state_attr('sensor.bewaesserung_planner', 'refill') or {} %}
          {% set refill_tank = refill.get('refill_tank', {}) %}
          {{ tank.get('warning') or refill.get('summary') or 'Ein Wassertank wird niedrig.' }}
          Haupttank: {{ tank.get('percent', '?') }} %, Vorratstank: {{ refill_tank.get('percent', '?') }} %.
